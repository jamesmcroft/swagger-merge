openapi: "3.0.3"
info:
  title: "Petstore API"
  description: "A sample API that uses a petstore as an example"
  version: "1.0.0"
servers:
  - url: "https://petstore.swagger.io/v3"
    description: "Production server"
tags:
  - name: "pet"
    description: "Everything about your Pets"
    externalDocs:
      description: "Find out more"
      url: "http://swagger.io"
paths:
  /pet:
    get:
      tags:
        - "pet"
      summary: "List all pets"
      operationId: "listPets"
      parameters:
        - name: "limit"
          in: "query"
          description: "How many items to return"
          required: false
          schema:
            type: "integer"
            format: "int32"
      responses:
        "200":
          description: "A list of pets"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/Pet"
    post:
      tags:
        - "pet"
      summary: "Add a new pet"
      operationId: "addPet"
      requestBody:
        description: "Pet object that needs to be added"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Pet"
      responses:
        "201":
          description: "Pet created"
        "400":
          description: "Invalid input"
  /pet/{petId}:
    get:
      tags:
        - "pet"
      summary: "Find pet by ID"
      operationId: "getPetById"
      parameters:
        - name: "petId"
          in: "path"
          description: "ID of pet to return"
          required: true
          schema:
            type: "integer"
            format: "int64"
      responses:
        "200":
          description: "successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "404":
          description: "Pet not found"
components:
  schemas:
    Pet:
      type: "object"
      required:
        - "name"
      properties:
        id:
          type: "integer"
          format: "int64"
        name:
          type: "string"
          example: "doggie"
        tag:
          type: "string"
  securitySchemes:
    api_key:
      type: "apiKey"
      name: "api_key"
      in: "header"
security:
  - api_key: []
